# Configuration de déploiement Netlify
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Application statique (un seul fichier HTML), aucune étape de build nécessaire.
  publish = "."

# En-têtes de sécurité et de cache
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Le document HTML et le service worker ne doivent jamais être mis en cache trop longtemps :
# le SW gère lui-même sa stratégie de cache applicative (voir sw.js), le HTTP cache ne doit
# pas s'interposer et retarder la détection d'une nouvelle version.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
